                      "outline-variant": "#3c494e",
                      "on-tertiary-fixed": "#00201b",
                      "on-error": "#690005",
                      "surface-tint": "#4cd6ff",
                      "surface-container": "#201f1f",
                      "inverse-primary": "#00677f",
                      "outline": "#859399",
                      "on-primary-fixed": "#001f28",
                      "on-primary": "#003543",
                      "on-tertiary-container": "#00594d",
                      "surface-container-low": "#1c1b1b",
                      "on-tertiary-fixed-variant": "#005046",
                      "on-primary-fixed-variant": "#004e60",
                      "on-surface-variant": "#bbc9cf",
                      "on-primary-container": "#00566a",
                      "primary": "#a4e6ff",
                      "primary-container": "#00d1ff",
                      "primary-fixed": "#b7eaff",
                      "surface-container-highest": "#353534",
                      "surface-bright": "#3a3939",
                      "secondary-fixed-dim": "#ebb2ff",
                      "on-error-container": "#ffdad6",
                      "surface-variant": "#353534",
                      "secondary": "#ebb2ff",
                      "inverse-on-surface": "#313030",
                      "tertiary-fixed-dim": "#00dfc4",
                      "inverse-surface": "#e5e2e1",
                      "error-container": "#93000a",
                      "secondary-fixed": "#f8d8ff",
                      "surface-container-high": "#2a2a2a",
                      "on-tertiary": "#00372f",
                      "surface-container-lowest": "#0e0e0e",
                      "surface": "#131313",
                      "tertiary": "#00f7d9",
                      "on-surface": "#e5e2e1",
                      "tertiary-container": "#00d8be",
                      "on-secondary-fixed-variant": "#74009f",

              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",

              "spacing": {

    <style>
        body {
            background-color: #0c0d12;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 209, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(206, 93, 255, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
            color: #e5e2e1;
            min-height: max(884px, 100dvh);
            overflow-x: hidden;
        }

        .glass-panel {
            background-color: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        }

        .glass-panel-glow {
            position: relative;
        }
        .glass-panel-glow::before {
            content: '';
            position: absolute;
            inset: -1px;
            background: linear-gradient(to bottom right, rgba(0, 209, 255, 0.2), transparent);
            z-index: -1;
            filter: blur(12px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .glass-panel-glow:hover::before {
            opacity: 1;
        }

        .scan-line {
            width: 100%;
            height: 2px;
            background: rgba(0, 247, 217, 0.1);
            position: absolute;
            animation: scan 4s linear infinite;
            z-index: 10;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .pulse-hologram {
            animation: hologram-pulse 2s ease-in-out infinite;
        }
        @keyframes hologram-pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); filter: brightness(1); }
            50% { opacity: 0.8; transform: scale(1.05); filter: brightness(1.3); }
        }

        .holographic-glow {
            filter: drop-shadow(0 0 10px rgba(164, 230, 255, 0.3));
        }

        .glow-text-primary {
            text-shadow: 0 0 10px rgba(76, 214, 255, 0.4);
        }

        .glow-text-positive {
            text-shadow: 0 0 10px rgba(0, 247, 217, 0.4);
        }

        .pulse-border {
            animation: pulse-border 2s infinite alternate;
        }
        @keyframes pulse-border {
            0% { border-color: rgba(206, 93, 255, 0.2); }
            100% { border-color: rgba(206, 93, 255, 0.7); box-shadow: 0 0 15px rgba(206, 93, 255, 0.15); }
        }

        .ai-pulse {
            animation: ai-pulse-border 2.5s infinite;
        }
        @keyframes ai-pulse-border {
            0% { border-color: rgba(206, 93, 255, 0.2); box-shadow: 0 0 0 0 rgba(206, 93, 255, 0.05); }
            50% { border-color: rgba(206, 93, 255, 0.7); box-shadow: 0 0 12px 0 rgba(206, 93, 255, 0.2); }
            100% { border-color: rgba(206, 93, 255, 0.2); box-shadow: 0 0 0 0 rgba(206, 93, 255, 0); }
        }

        .chart-line-gradient {
            background: linear-gradient(180deg, rgba(0, 247, 217, 0.08) 0%, rgba(0, 247, 217, 0) 100%);
        }

        .sparkline-positive {
            background: linear-gradient(to top, rgba(0, 247, 217, 0.15), transparent);
        }
        .sparkline-negative {
            background: linear-gradient(to top, rgba(255, 180, 171, 0.15), transparent);
        }

        /* Ambient animated background grid */
        .ambient-grid {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: -2;
            opacity: 0.5;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            pointer-events: none;
        }

        /* Hide scrollbars but keep functionality */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Custom scrollbar for HUD panels */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4cd6ff;
        }

        /* Custom range sliders styling */
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #ebb2ff;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(235, 178, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .range-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #ebb2ff;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(235, 178, 255, 0.8);
            border: none;
        }
    </style>
  </head>
  <body>
    <div class="ambient-grid"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
